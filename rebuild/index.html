<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>家的味道｜線上點餐</title>
<style>
:root{--ink:#352d27;--muted:#85786c;--brand:#9a5637;--cream:#fbf7f0;--line:#eadfd2;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
header{background:#fff;padding:22px max(20px,calc((100% - 1100px)/2));border-bottom:1px solid var(--line)}
.brand{font-size:25px;font-weight:800;letter-spacing:2px}.tag{color:var(--muted);font-size:13px;margin-top:4px}
main{max-width:1100px;margin:26px auto;padding:0 18px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px}
h1{font-size:25px;margin:0 0 6px}.intro{color:var(--muted);margin-bottom:18px}
#categories{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.chip,button{border:0;border-radius:999px;padding:10px 16px;cursor:pointer;font:inherit}
.chip{background:#eee5da;color:var(--ink)}.chip.active,button.primary{background:var(--brand);color:white}
#menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.item,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:15px}
.item h3{margin:0 0 6px;font-size:17px}.desc{font-size:13px;color:var(--muted);min-height:20px}.price{font-weight:750;color:var(--brand);margin:10px 0}
.item button{padding:8px 14px;background:#f2e8df;color:var(--brand)}
.panel{position:sticky;top:16px;height:max-content}.panel h2{font-size:19px;margin:0 0 14px}
.cartrow{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.qty button{padding:2px 9px;background:#f2e8df;color:var(--ink);margin-left:4px}
.total{font-size:20px;font-weight:800;text-align:right;padding:15px 0}
label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white;font:inherit;color:var(--ink)}
textarea{min-height:70px;resize:vertical}.hidden{display:none}
button.primary{width:100%;font-weight:700}.notice{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}
#status{margin-top:12px;font-size:14px;line-height:1.5}
.empty{padding:28px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:14px;grid-column:1/-1}
@media(max-width:800px){main{grid-template-columns:1fr}.panel{position:static}#menu{grid-template-columns:1fr 1fr}}
@media(max-width:430px){#menu{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="brand">家的味道</div><div class="tag">一份用心料理，讓每一餐都有家的味道</div></header>
<main>
<section>
<h1>今天想吃點什麼？</h1><div class="intro">選好餐點，加入購物車即可訂購。</div>
<div id="categories"></div><div id="menu"><div class="empty">正在載入餐點…</div></div>
</section>
<aside class="panel">
<h2>🧺 我的訂單</h2><div id="cart"><div class="notice">尚未選擇餐點</div></div>
<div class="total">合計 $<span id="total">0</span></div>
<label for="method">取餐方式</label><select id="method"><option value="內用">內用</option><option value="外帶">外帶</option><option value="外送">外送</option></select>
<div id="tableWrap"><label for="table">桌號（選填）</label><input id="table" placeholder="例如：3"></div>
<div id="delivery" class="hidden">
<label for="customer">收件人姓名</label><input id="customer" autocomplete="name" placeholder="請輸入姓名">
<label for="phone">聯絡電話</label><input id="phone" autocomplete="tel" placeholder="請輸入電話">
<label for="address">外送地址</label><input id="address" autocomplete="street-address" placeholder="請輸入完整地址">
</div>
<label for="pickup">希望取餐時間（選填）</label><input id="pickup" type="time">
<label for="notes">備註（選填）</label><textarea id="notes" placeholder="餐點需求或其他備註"></textarea>
<button class="primary" id="submit">送出訂單</button>
<div id="status" role="status"></div>
<div class="notice">內用、外帶不必填姓名與電話；外送需填寫聯絡資料。請以店家回覆確認訂單。</div>
</aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
const $=s=>document.querySelector(s);
let db=null,items=[],cart=new Map(),active='全部';
function money(n){return Number(n||0).toLocaleString('zh-TW')}
function showStatus(t,ok=false){$('#status').textContent=t;$('#status').style.color=ok?'#287447':'#a0442d'}
function setMethod(){const delivery=$('#method').value==='外送';$('#delivery').classList.toggle('hidden',!delivery);$('#tableWrap').classList.toggle('hidden',$('#method').value!=='內用')}
$('#method').addEventListener('change',setMethod);setMethod();
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getOptions(x){
 const n=String(x.name||'');
 if(n==='水餃') return {kind:'dumpling'};
 if(['乾麵','湯麵','麻醬麵'].includes(n)) return {kind:'noodle'};
 if(['肉燥飯','魚皮飯湯','魚肚飯湯','海鮮飯湯'].includes(n)) return {kind:'rice'};
 return {kind:'none'};
}
function renderCategories(){const cats=['全部',...new Set(items.map(x=>x.category).filter(Boolean))];$('#categories').innerHTML=cats.map(c=>'<button class="chip '+(c===active?'active':'')+'" data-cat="'+escapeHtml(c)+'">'+escapeHtml(c)+'</button>').join('');$('#categories').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.cat;renderCategories();renderMenu()})}
function renderMenu(){
 const list=items.filter(x=>active==='全部'||x.category===active);
 $('#menu').innerHTML=list.length?list.map(x=>{
  const opt=getOptions(x);let controls='';
  if(opt.kind==='dumpling') controls='<label>數量（基本 10 顆 $50）</label><input class="custom-qty" type="number" min="10" step="1" value="10" data-qty="'+x.id+'"><div class="desc">每增加 1 顆 +$5</div>';
  if(opt.kind==='noodle') controls='<label>麵條種類</label><select data-noodle="'+x.id+'"><option>細麵</option><option>寬麵</option><option>鹽水意麵</option></select><label><input type="checkbox" data-extra-noodle="'+x.id+'" style="width:auto"> 加麵 +$10</label>';
  if(opt.kind==='rice') controls='<label><input type="checkbox" data-extra-rice="'+x.id+'" style="width:auto"> 加飯 +$10</label>';
  return '<article class="item"><h3>'+escapeHtml(x.name)+'</h3><div class="desc">'+escapeHtml(x.description||'')+'</div><div class="price">$'+money(x.price)+'</div>'+controls+'<button data-add="'+x.id+'">加入購物車</button></article>';
 }).join(''):'<div class="empty">目前沒有供應中的餐點</div>';
 $('#menu').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));
}
function add(id){
 const x=items.find(a=>String(a.id)===String(id));if(!x)return;
 const opt=getOptions(x);let choice={};
 if(opt.kind==='dumpling'){const q=Math.max(10,Math.floor(Number(document.querySelector('[data-qty="'+id+'"]').value)||10));choice={quantity:q,unit_label:'顆'};}
 if(opt.kind==='noodle'){choice={noodle_type:document.querySelector('[data-noodle="'+id+'"]').value,extra_noodle:document.querySelector('[data-extra-noodle="'+id+'"]').checked};}
 if(opt.kind==='rice'){choice={extra_rice:document.querySelector('[data-extra-rice="'+id+'"]').checked};}
 let unitPrice=Number(x.price||0);
 if(opt.kind==='dumpling') unitPrice=50+(choice.quantity-10)*5;
 if(choice.extra_noodle||choice.extra_rice) unitPrice+=10;
 const key=String(id)+'|'+JSON.stringify(choice);
 const row=cart.get(key)||{item:x,qty:0,choice,unitPrice,key};row.qty++;cart.set(key,row);renderCart();
}
function change(key,d){const row=cart.get(key);if(!row)return;row.qty+=d;if(row.qty<=0)cart.delete(key);renderCart()}
function choiceLabel(c){const a=[];if(c.noodle_type)a.push(c.noodle_type);if(c.extra_noodle)a.push('加麵');if(c.extra_rice)a.push('加飯');if(c.quantity)a.push(c.quantity+'顆');return a.join('、')}
function renderCart(){
 let total=0;
 $('#cart').innerHTML=cart.size?[...cart.entries()].map(([key,r])=>{
  const line=r.unitPrice*r.qty;total+=line;
  return '<div class="cartrow"><span>'+escapeHtml(r.item.name)+(choiceLabel(r.choice)?'<small style="display:block;color:#85786c">'+escapeHtml(choiceLabel(r.choice))+'</small>':'')+' × '+r.qty+'</span><span class="qty">$'+money(line)+' <button data-key="'+encodeURIComponent(key)+'" data-d="-1">−</button><button data-key="'+encodeURIComponent(key)+'" data-d="1">+</button></span></div>';
 }).join(''):'<div class="notice">尚未選擇餐點</div>';
 $('#cart').querySelectorAll('button').forEach(b=>b.onclick=()=>change(decodeURIComponent(b.dataset.key),Number(b.dataset.d)));
 $('#total').textContent=money(total);
}
async function init(){
 if(!window.APP_CONFIG?.supabaseUrl||!window.APP_CONFIG?.supabaseAnonKey){$('#menu').innerHTML='<div class="empty">網站畫面已建立，尚待設定 Supabase 公開連線資料。</div>';return}
 db=window.supabase.createClient(APP_CONFIG.supabaseUrl,APP_CONFIG.supabaseAnonKey);
 const {data,error}=await db.from('menu_items').select('*').eq('is_available',true).order('sort_order',{ascending:true});
 if(error){$('#menu').innerHTML='<div class="empty">餐點載入失敗，請檢查資料庫連線與讀取權限。</div>';showStatus(error.message);return}
 items=data||[];renderCategories();renderMenu();
}
$('#submit').onclick=async()=>{
 if(!db){showStatus('尚未設定 Supabase 連線，現在還不能正式送單。');return}
 if(!cart.size){showStatus('請先選擇餐點。');return}
 const method=$('#method').value,customer=$('#customer').value.trim(),phone=$('#phone').value.trim(),address=$('#address').value.trim();
 if(method==='外送'&&(!customer||!phone||!address)){showStatus('外送請填寫姓名、電話及地址。');return}
 const rows=[...cart.values()],total=rows.reduce((s,r)=>s+r.unitPrice*r.qty,0),d=new Date();
 const order={order_number:Math.floor(Date.now()/1000),customer_name:method==='外送'?customer:null,table_number:method==='內用'?$('#table').value.trim()||null:null,dining_method:method,items:rows.map(r=>({id:r.item.id,name:r.item.name,base_price:r.item.price,unit_price:r.unitPrice,quantity:r.qty,options:r.choice})),total_amount:total,order_date:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),notes:$('#notes').value.trim()||null,phone:method==='外送'?phone:null,delivery_address:method==='外送'?address:null,pickup_time:$('#pickup').value.trim()||null,status:'待確認'};
 $('#submit').disabled=true;showStatus('正在送出…');
 const {error}=await db.from('orders').insert(order);$('#submit').disabled=false;
 if(error){showStatus('送單失敗，請聯絡店家。');return}
 cart.clear();renderCart();showStatus('訂單已送出！請留意店家確認訊息。',true)
};
init();
</script>
</body></html>
