<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家的味道｜線上點餐</title>
<style>
:root{--brown:#873f2b;--cream:#fff8ef;--gold:#e8b16b;--ink:#49352a;}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--cream);color:var(--ink)}
header{background:var(--brown);color:white;padding:24px 16px;text-align:center}
header h1{margin:0;font-size:clamp(24px,4vw,34px)} header p{margin:8px 0 0}
nav{display:flex;justify-content:center;gap:10px;padding:14px;background:white;flex-wrap:wrap;position:sticky;top:0;z-index:3}
nav button,.primary{border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer;background:#f1e3d5;color:var(--brown)}
nav button.active,.primary{background:var(--brown);color:white}
main{max-width:1050px;margin:auto;padding:18px}
.section{display:none}.section.active{display:block}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 3px 12px #0000000a}
h2{color:var(--brown);margin-top:0}
.categories{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.cat{border:1px solid #e6d4c4;background:#fffaf5;color:var(--brown);padding:9px 13px;border-radius:20px;cursor:pointer}
.cat.active{background:var(--brown);color:white}
.menu-item{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:1px solid #eee;padding:13px 0}
.menu-item:last-child{border-bottom:0}
.item-info strong{font-size:17px}.price{margin-top:4px}
.item-options{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.item-options select{width:auto;margin:0;padding:7px;border:1px solid #ddd;border-radius:7px}
.menu-item button{background:var(--gold);border:0;border-radius:9px;padding:10px 14px;cursor:pointer;white-space:nowrap}
input,select,textarea{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:8px;font-size:16px}
.cart-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eee}
.cart-row button{border:0;background:#f8e8df;color:#8a3524;border-radius:6px;padding:4px 9px}
.order{border-left:5px solid #c17b45}
footer{text-align:center;padding:24px;color:#987b68}
@media(max-width:600px){main{padding:10px}.card{padding:15px}.menu-item{align-items:flex-start}}
</style>
</head>
<body>
<header><h1>🍜 家的味道</h1><p>用心料理・家的好味道</p></header>
<nav>
<button class="active" onclick="showSection('order',this)">客人點餐</button>
<button onclick="showSection('manage',this)">店內訂單</button>
<button onclick="showSection('menu',this)">菜單管理</button>
</nav>
<main>
<section id="order" class="section active">
<div class="card">
<h2>今日菜單</h2><p>歡迎光臨！請選擇您喜愛的餐點。</p>
<div id="categories" class="categories"></div><div id="menuList"></div>
</div>
<div class="card"><h2>🛒 我的訂單</h2><div id="cartList">尚未選擇餐點</div><h3 id="total">總金額：$0</h3><button class="primary" onclick="clearCart()">清空購物車</button></div>
<div class="card"><h2>📋 訂單資料</h2>
<label>訂購人姓名</label><input id="customer" placeholder="請輸入姓名">
<label>聯絡電話</label><input id="phone" placeholder="請輸入電話">
<label>用餐方式</label><select id="method" onchange="toggleAddress()"><option value="外帶">外帶</option><option value="內用">內用</option><option value="外送">外送</option></select>
<div id="addressBox" style="display:none"><label>外送地址（必填）</label><input id="address" placeholder="請輸入完整外送地址"></div>
<label>桌號（內用填寫）</label><input id="table" placeholder="例如：3號桌">
<label>訂單備註</label><textarea id="notes" rows="3" placeholder="例如：不要辣、少油、餐具需求"></textarea>
<button class="primary" onclick="submitOrder()">送出訂單</button>
</div></section>
<section id="manage" class="section"><div class="card"><h2>🧾 店內訂單管理</h2><p>此版本訂單僅暫存在目前瀏覽器，尚未同步至其他裝置。</p><div id="ordersList"></div></div></section>
<section id="menu" class="section"><div class="card"><h2>🍱 菜單管理</h2>
<label>餐點名稱</label><input id="newName" placeholder="例如：今日特餐">
<label>餐點價格</label><input id="newPrice" type="number" placeholder="例如：50">
<label>餐點分類</label><select id="newCategory"><option>麵類</option><option>飯類</option><option>羹類</option><option>炒類</option><option>便當類</option><option>湯類</option><option>小菜類</option></select>
<button class="primary" onclick="addMenu()">新增餐點</button>
</div></section>
</main><footer>家的味道餐館 © 2026</footer>

let selectedCategory="全部",cart=[],orders=[];
function showSection(id,btn){document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));document.getElementById(id).classList.add("active");btn.classList.add("active");}
function renderCategories(){document.getElementById("categories").innerHTML=categories.map(c=>`<button class="cat ${c===selectedCategory?'active':''}" onclick="chooseCategory(${JSON.stringify(c)})">${c}</button>`).join("");}
function chooseCategory(c){selectedCategory=c;renderCategories();renderMenu();}
function renderMenu(){const list=document.getElementById("menuList");const filtered=menu.map((item,index)=>({item,index})).filter(x=>selectedCategory==="全部"||x.item.category===selectedCategory);
list.innerHTML=filtered.map(({item,index})=>`<div class="menu-item"><div class="item-info"><strong>${item.name}</strong><div class="price">$${item.price}</div>${item.options&&item.options.length?`<div class="item-options"><select id="option-${index}">${item.options.map(o=>`<option>${o}</option>`).join("")}</select></div>`:""}</div><button onclick="addCart(${index})">加入</button></div>`).join("")||"<p>此分類目前沒有餐點。</p>";}
function addCart(index){const item=menu[index];const option=item.options&&item.options.length?document.getElementById("option-"+index).value:"";cart.push({name:item.name+(option?"（"+option+"）":""),price:item.price});renderCart();}
function renderCart(){const list=document.getElementById("cartList");const total=cart.reduce((s,i)=>s+i.price,0);list.innerHTML=cart.length?cart.map((i,index)=>`<div class="cart-row"><span>${i.name} $${i.price}</span><button onclick="removeCart(${index})">移除</button></div>`).join(""):"尚未選擇餐點";document.getElementById("total").textContent="總金額：$"+total;}
function removeCart(i){cart.splice(i,1);renderCart();}function clearCart(){cart=[];renderCart();}
function toggleAddress(){document.getElementById("addressBox").style.display=document.getElementById("method").value==="外送"?"block":"none";}
function submitOrder(){const customer=document.getElementById("customer").value.trim(),phone=document.getElementById("phone").value.trim(),method=document.getElementById("method").value,address=document.getElementById("address").value.trim();if(!customer||!phone||!cart.length){alert("請填寫姓名、電話並選擇餐點！");return;}if(method==="外送"&&!address){alert("外送訂單必須填寫地址！");return;}const order={customer,phone,method,address,table:document.getElementById("table").value,notes:document.getElementById("notes").value,items:[...cart],total:cart.reduce((s,i)=>s+i.price,0),status:"新訂單"};orders.push(order);renderOrders();alert("訂單已建立！目前僅保存在此瀏覽器。");cart=[];renderCart();}
function renderOrders(){document.getElementById("ordersList").innerHTML=orders.map((o,i)=>`<div class="card order"><h3>訂單 ${i+1}｜${o.customer}</h3><p>電話：${o.phone}</p><p>方式：${o.method}</p><p>地址：${o.address||"—"}</p><p>桌號：${o.table||"—"}</p><p>餐點：${o.items.map(x=>x.name).join("、")}</p><p>備註：${o.notes||"—"}</p><h3>總金額：$${o.total}</h3><select onchange="orders[${i}].status=this.value">${["新訂單","製作中","待取餐","已完成","已取消"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}</select></div>`).join("");}
function addMenu(){const name=document.getElementById("newName").value.trim(),price=Number(document.getElementById("newPrice").value),category=document.getElementById("newCategory").value;if(!name||price<=0){alert("請輸入正確餐點名稱與價格！");return;}menu.push({name,price,category,options:[]});renderMenu();document.getElementById("newName").value="";document.getElementById("newPrice").value="";alert("餐點已新增！");}
renderCategories();renderMenu();
